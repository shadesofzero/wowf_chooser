# Effects an answer can have (weights are usually -3..3):
#   role: <role>        +w when the spec can fill that role
#   theme: <theme>      +w when the spec has that theme
#   trait: <trait>      w * (trait - 1.5)   (traits are 0-3, so low values can score positive on negative weights)
#   viability: <content> w * (rating - 3) / 1.5   (ratings are 1-5)
#   race_tag: <tag>     +w per matching racial on a race
#   look: <look>        +w when the race has that look
#   novelty: true       +w on new race/class combos and new races
# Answers may also set `filter: {faction: alliance|horde}`.
# On multi questions, `exclusive: true` makes an answer deselect all the others.
# Role effects don't stack: a spec scores only its best-matching chosen role.
# `why` overrides the auto-generated reason shown in results.
questions:
  - id: faction
    text: Do you have a faction in mind?
    help: Every class is available on both factions in Forever, so this only narrows your race choices.
    type: single
    answers:
      - id: alliance
        icon: ui_allianceicon
        text: "Alliance: for the King!"
        filter: {faction: alliance}
      - id: horde
        icon: ui_hordeicon
        text: "Horde: Lok'tar ogar!"
        filter: {faction: horde}
      - id: any
        icon: inv_misc_map_01
        text: No preference. I'll go where my friends are or pick what fits best.

  - id: role
    text: What's your main role in a group?
    help: Your results will also show what else each class can do.
    type: single
    answers:
      - id: tank
        icon: inv_shield_06
        text: "Tank: lead the charge and take the hits"
        effects: [{role: tank, w: 6}]
      - id: healer
        icon: spell_holy_heal
        text: "Heal: keep everyone alive"
        effects: [{role: healer, w: 6}]
      - id: melee
        icon: inv_sword_04
        text: "Melee damage: reach out and stab someone"
        effects: [{role: melee, w: 6}]
      - id: ranged
        icon: ability_marksmanship
        text: "Ranged damage: death from above (over there)"
        effects: [{role: ranged, w: 6}]
      - id: flex
        icon: ability_druid_catform
        text: I want to be able to do a bit of everything
        effects: [{trait: utility, w: 2}, {theme: shapeshift, w: 1}, {theme: elements, w: 1}]

  # The fantasy questions are deliberately indirect: every answer leans toward
  # two or three classes, so no single pick gives the result away.
  - id: source
    text: Where does your power come from?
    type: single
    answers:
      - id: faith
        icon: spell_holy_holybolt
        text: "Faith: something greater than me works through my hands"
        effects: [{theme: holy, w: 2}, {theme: elements, w: 1.5}]
      - id: knowledge
        icon: inv_misc_book_09
        text: "Knowledge: I have a library card, and I'm not afraid to use it. Even on the weird spooky stuff."
        effects: [{theme: arcane, w: 2}, {theme: shadow, w: 1.5}, {theme: demons, w: 1}]
      - id: land
        icon: spell_nature_protectionformnature
        text: "The land: its spirits and creatures answer when I call"
        effects: [{theme: nature, w: 2}, {theme: elements, w: 1.5}, {theme: beasts, w: 1}]
      - id: training
        icon: inv_sword_27
        text: "Training: there is nothing I cannot accomplish with my hands and a good blade"
        effects: [{theme: weapons, w: 2}, {theme: stealth, w: 1}, {theme: heavy_armor, w: 1}]
      - id: secret
        icon: spell_shadow_shadowwordpain
        text: There are forces you cannot imagine beyond the mortal plane
        effects: [{theme: shadow, w: 2}, {theme: demons, w: 1}, {theme: stealth, w: 1}]

  - id: scene
    text: Which moment would you most want to live out?
    type: single
    answers:
      - id: doorway
        icon: inv_shield_06
        text: Holding a doorway alone while the enemy pours in
        effects: [{theme: heavy_armor, w: 2}, {theme: weapons, w: 1}, {trait: survivability, w: 0.5}]
      - id: vanish
        icon: ability_stealth
        text: I wasn't here, you never saw me
        effects: [{theme: stealth, w: 2}, {theme: shapeshift, w: 1}, {trait: burst, w: 0.5}]
      - id: hunt
        icon: ability_hunter_beasttaming
        text: Tracking something through the wilds for days, and finally finding it
        effects: [{theme: beasts, w: 2}, {theme: nature, w: 1}, {theme: weapons, w: 0.5}]
      - id: unleash
        icon: spell_fire_flamebolt
        text: Umm, I think I might have unleashed something...
        effects: [{theme: arcane, w: 1.5}, {theme: shadow, w: 1.5}, {theme: elements, w: 1}, {theme: demons, w: 1}]
      - id: rescue
        icon: spell_holy_heal
        text: You're not going to die on my watch!!!
        effects: [{theme: holy, w: 1.5}, {theme: nature, w: 1}, {theme: elements, w: 1}]

  - id: company
    text: How do you picture yourself on the road?
    type: single
    answers:
      - id: companion
        icon: spell_shadow_summonimp
        text: "Never truly alone: something always walks beside me"
        effects: [{theme: beasts, w: 1.5}, {theme: demons, w: 1.5}, {trait: pet, w: 1}]
      - id: adapt
        icon: ability_druid_catform
        text: "Never the same twice: I become whatever the road demands"
        effects: [{theme: shapeshift, w: 1.5}, {theme: elements, w: 1}, {trait: utility, w: 1}]
      - id: lone
        icon: inv_sword_04
        text: Just me and what I carry
        effects: [{theme: weapons, w: 1.5}, {theme: stealth, w: 1}, {theme: heavy_armor, w: 1}]
      - id: center
        icon: spell_holy_prayerofhealing02
        text: At the heart of a group that's counting on me
        effects: [{theme: holy, w: 1.5}, {theme: elements, w: 1}, {trait: group, w: 1}]
      - id: study
        icon: inv_misc_book_11
        text: Alone with my thoughts, and whatever whispers back
        effects: [{theme: arcane, w: 1.5}, {theme: shadow, w: 1.5}]

  - id: complexity
    text: How much complexity do you want?
    type: single
    answers:
      - id: simple
        text: Keep it simple. I want to relax
        effects: [{trait: complexity, w: -2}]
      - id: medium
        text: Some depth, but nothing overwhelming
      - id: complex
        text: Give me something to master (but not like, retail, obviously)
        effects: [{trait: complexity, w: 2}]

  - id: content
    text: What will you spend most of your time doing at 60?
    type: single
    answers:
      - id: raid
        icon: inv_misc_head_dragon_01
        text: "Raiding: clearing Molten Core and beyond"
        effects: [{viability: raid, w: 2}, {trait: group, w: 1}]
      - id: dungeons
        icon: inv_misc_key_03
        text: Dungeons with friends or pugs
        effects: [{viability: dungeons, w: 2}, {trait: group, w: 1}]
      - id: pvp
        icon: inv_bannerpvp_02
        text: "PvP: battlegrounds and world PvP"
        effects: [{viability: pvp, w: 2}, {trait: pvp, w: 1}, {race_tag: pvp, w: 1.5}]
      - id: solo
        icon: inv_misc_map_01
        text: Questing, farming and exploring on my own
        effects: [{viability: leveling, w: 2}, {trait: solo, w: 1}, {race_tag: leveling, w: 1}]
      - id: mix
        icon: inv_misc_bag_10
        text: A casual mix of everything

  - id: solo
    text: How important is leveling and playing solo?
    help: Leveling 1–60 is estimated at around 150 hours in Forever.
    type: single
    answers:
      - id: very
        text: Very. I level alone and want it smooth
        effects: [{trait: solo, w: 2}, {race_tag: leveling, w: 0.5}]
      - id: some
        text: Somewhat. I'll group sometimes
        effects: [{trait: solo, w: 0.5}]
      - id: not
        text: Not much. I'll be grouping most of the time
        effects: [{trait: group, w: 1}]

  - id: range
    text: Where do you like to be in a fight?
    type: single
    answers:
      - id: close
        text: In the thick of it
        effects: [{trait: range, w: -1.5}]
      - id: far
        text: At a safe distance, kiting if needed
        effects: [{trait: range, w: 1.5}]
      - id: either
        text: Doesn't matter

  - id: pace
    text: Which rhythm sounds more fun?
    type: single
    answers:
      - id: burst
        text: "Explosive bursts: line up cooldowns and delete targets"
        effects: [{trait: burst, w: 1.5}, {race_tag: burst, w: 0.5}]
      - id: sustained
        text: "Steady pressure: wear enemies down over time"
        effects: [{trait: burst, w: -1.5}]
      - id: either
        text: I don't care, as long as it dies

  - id: survival
    text: How do you feel about dying?
    type: single
    answers:
      - id: tough
        text: I want to be hard to kill
        effects: [{trait: survivability, w: 1.5}, {race_tag: survival, w: 0.5}]
      - id: glass
        text: Glass cannon is fine if the damage is worth it
        effects: [{trait: survivability, w: -1}, {trait: burst, w: 0.5}]
      - id: either
        text: I don't know, man, I'm just trying to take this quiz, not think about my existential dread

  - id: utility
    text: Would you consider yourself a helpful person?
    type: single
    answers:
      - id: utility
        text: "Yes: buffs, crowd control, portals, resurrections"
        effects: [{trait: utility, w: 1.5}]
      - id: focused
        text: "Listen, killing stuff REALLY FAST is helping"
        effects: [{trait: utility, w: -1}]
      - id: either
        text: Isn't this a video game?

  - id: pet
    text: How do you feel about pets?
    type: single
    answers:
      - id: love
        text: Love them -- I want a permanent companion
        effects: [{trait: pet, w: 2}]
      - id: no
        text: No thanks -- I'd rather not manage one
        effects: [{trait: pet, w: -2}]
      - id: either
        text: I don't have strong feelings about animals (or anything, really)

  - id: novelty
    text: Do you want something new to Forever?
    help: New combos include Undead Paladin, Dwarf Shaman, Gnome Priest, Human Hunter, Orc Mage, Troll Warlock, and the new Skyborne race.
    type: single
    answers:
      - id: new
        text: "Yes: new combos, reworked specs, the new Skyborne race"
        effects: [{trait: forever_new, w: 1.5}, {novelty: true, w: 3}]
      - id: classic
        text: No, I want the Classic experience I remember or someone told me about
        effects: [{trait: forever_new, w: -1}, {novelty: true, w: -2}]
      - id: either
        text: Either is fine

  - id: look
    text: What should your character look like?
    type: single
    answers:
      - {id: tall, icon: race_tauren_male, text: "Tall and imposing", effects: [{look: tall, w: 1.5}]}
      - {id: short, icon: race_gnome_female, text: "Short and sturdy", effects: [{look: short, w: 1.5}]}
      - {id: brutish, icon: race_orc_male, text: "Brutish and powerful", effects: [{look: brutish, w: 1.5}]}
      - {id: elegant, icon: race_nightelf_female, text: "Graceful and elegant", effects: [{look: elegant, w: 1.5}]}
      - {id: undead, icon: race_scourge_male, text: "Undead and macabre", effects: [{look: undead, w: 2}]}
      - {id: exotic, icon: ability_druid_galewinds, text: "Something unusual", effects: [{look: exotic, w: 1.5}]}
