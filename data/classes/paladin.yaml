id: paladin
name: Paladin
color: "#F48CBA"
icon: classicon_paladin
wowhead_class_id: 2
armor: Plate
fantasy: >
  A holy warrior wielding the Light to heal allies, shield the weak and smite
  the wicked. Now open to the Horde through the new Undead Paladin.
changes:
  - text: "Holy Strike: new instant Holy weapon strike on a 10s cooldown, learned at level 6."
    confidence: confirmed
    sources: [lfcarry-classes, blizz-beta-notes-0924]
  - text: "Judgement no longer consumes the active Seal."
    confidence: likely
    sources: [lfcarry-classes]
  - text: "Seal of Fury: new tank seal; Judgement taunts at 10 yards. Protection gets a seal-dependent taunt."
    confidence: confirmed
    sources: [mobalytics-explained, lfcarry-classes]
  - text: "Consecration is baseline at level 20."
    confidence: likely
    sources: [lfcarry-classes]
  - text: "Spec talents: Light's Vigil (Holy), Swift Judgement (Protection), Twist of Light (Retribution seal twisting; also makes Seals cost 20% less mana)."
    confidence: likely
    sources: [lfcarry-classes, blizz-beta-notes-0924]
  - text: "Righteous Fury's Holy threat bonus is 60% (Classic Era: 90%)."
    confidence: confirmed
    sources: [blizz-beta-notes-0924]
  - text: "Blessing of Kings is baseline. Paladins still have no interrupt and no slow."
    confidence: likely
    sources: [mobalytics-explained, lfcarry-classes]
  - text: "Available to both factions (Undead Paladin is a new Horde option)."
    confidence: confirmed
    sources: [blizz-create-hero]
